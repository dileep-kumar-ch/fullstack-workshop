<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Counter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex align-items-center justify-content-center">
    <div>
      <h1>Interactive Counter</h1>
      <div>
        <div class="d-flex justify-content-around m-5">
          <span class="border border-primary p-3">
            <h1 id="output">0</h1>
          </span>
        </div>
        <div class="d-flex justify-content-around">
          <button type="button" onclick="dec()" class="btn btn-warning">
            Decrecment --
          </button>
          <button type="button" onclick="reset()" class="btn btn-secondary">
            Reset 0
          </button>
          <button type="button" onclick="inc()" class="btn btn-warning">
            Increment ++
          </button>
        </div>

        <div class="d-flex justify-content-around m-5">
          <h3>Steps:</h3>
          <button type="button" onclick="one()" class="btn btn-primary">
            +1
          </button>

          <button type="button" onclick="five()" class="btn btn-primary">
            +5
          </button>
          <button type="button" onclick="ten()" class="btn btn-primary">
            +10
          </button>
        </div>
      </div>
    </div>

    <script src="../Interactive Counter/counter.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
